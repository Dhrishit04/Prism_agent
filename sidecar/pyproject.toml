[project]
name = "prism-sidecar"
version = "0.1.0"
description = "Prism AI Agent Python sidecar"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
voice = [
    "pvporcupine>=3.0.0",
    "whisper-cpp-python>=0.1.0",
    "piper-tts>=1.0.0",
    "sounddevice>=0.4.6",
]
google = [
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    "cryptography>=42.0.0",
]